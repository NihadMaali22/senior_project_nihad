# ============================================================
# Decision-Making Academic Assistant — Docker Compose
# ============================================================
# Usage:
#   docker compose up -d                        # Start all services
#   docker compose up -d postgres qdrant ollama # Start infra only
#   docker compose logs -f app                  # Follow app logs
#   docker compose down -v                      # Stop and remove volumes
# ============================================================

services:
  # --------------------------------------------------------
  # PostgreSQL 16 — Student & Academic Data
  # --------------------------------------------------------
  postgres:
    image: postgres:16-alpine
    container_name: academic_postgres
    restart: unless-stopped
    environment:
      POSTGRES_USER: academic_user
      POSTGRES_PASSWORD: academic_pass_2024
      POSTGRES_DB: academic_db
      POSTGRES_INITDB_ARGS: "--encoding=UTF-8 --lc-collate=en_US.UTF-8 --lc-ctype=en_US.UTF-8"
    ports:
      - "5432:5432"
    volumes:
      - postgres_data:/var/lib/postgresql/data
      - ./sql/schema.sql:/docker-entrypoint-initdb.d/01-schema.sql:ro
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U academic_user -d academic_db"]
      interval: 10s
      timeout: 5s
      retries: 5
      start_period: 30s
    networks:
      - academic_net

  # --------------------------------------------------------
  # Qdrant v1.9 — Vector Database for Regulations
  # --------------------------------------------------------
  qdrant:
    image: qdrant/qdrant:v1.13.6
    container_name: academic_qdrant
    restart: unless-stopped
    ports:
      - "6333:6333"   # REST API
      - "6334:6334"   # gRPC
    volumes:
      - qdrant_data:/qdrant/storage
    environment:
      QDRANT__SERVICE__GRPC_PORT: "6334"
    healthcheck:
      test: ["CMD-SHELL", "wget -q --spider http://localhost:6333/healthz || exit 1"]
      interval: 15s
      timeout: 5s
      retries: 5
      start_period: 20s
    networks:
      - academic_net

  # --------------------------------------------------------
  # Ollama — Local LLM Server (llama3.1:8b)
  # --------------------------------------------------------
  ollama:
    image: ollama/ollama:0.3.12
    container_name: academic_ollama
    restart: unless-stopped
    ports:
      - "11434:11434"
    volumes:
      - ollama_data:/root/.ollama
    # ── GPU support (NVIDIA only) ──────────────────────────
    # Requires nvidia-container-toolkit on the host.
    # Remove or comment out this block on CPU-only machines.
    # deploy:
    #   resources:
    #     reservations:
    #       devices:
    #         - driver: nvidia
    #           count: all
    #           capabilities: [gpu]
    healthcheck:
      test: ["CMD-SHELL", "curl -sf http://localhost:11434/ || exit 1"]
      interval: 15s
      timeout: 5s
      retries: 5
      start_period: 30s
    networks:
      - academic_net

  # --------------------------------------------------------
  # Ollama Init — Pull the LLM model on first run
  # --------------------------------------------------------
  ollama-init:
    image: ollama/ollama:0.3.12
    container_name: academic_ollama_init
    entrypoint: ["/bin/sh", "-c"]
    command: >
      "until curl -sf http://ollama:11434/; do echo 'waiting for ollama...'; sleep 3; done;
       ollama pull llama3.1:8b"
    environment:
      OLLAMA_HOST: http://ollama:11434
    depends_on:
      ollama:
        condition: service_healthy
    networks:
      - academic_net
    restart: "no"

  # --------------------------------------------------------
  # Application — Academic Decision Assistant
  # --------------------------------------------------------
  app:
    build:
      context: .
      dockerfile: Dockerfile
    container_name: academic_assistant
    restart: unless-stopped
    ports:
      - "8000:8000"
    env_file:
      - .env
    environment:
      # Override connection hosts to use Docker service names
      DATABASE_URL: postgresql+asyncpg://academic_user:academic_pass_2024@postgres:5432/academic_db
      QDRANT_URL: http://qdrant:6333
      OLLAMA_URL: http://ollama:11434
    volumes:
      - ./data:/app/data
    depends_on:
      postgres:
        condition: service_healthy
      qdrant:
        condition: service_healthy
      ollama:
        condition: service_healthy
    networks:
      - academic_net

volumes:
  postgres_data:
    driver: local
  qdrant_data:
    driver: local
  ollama_data:
    driver: local

networks:
  academic_net:
    driver: bridge
